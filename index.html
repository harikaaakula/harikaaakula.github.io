<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harika Aakula | Data Analytics Portfolio</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }
body { background:#0b0b0b; color:#e5e7eb; font-family:'Poppins',sans-serif; }

/* Panels & Cards */
.bg-panel { background:#141414; }
.accent-purple { color:#a855f7; }
.accent-cyan { color:#22d3ee; }
.card {
  background:#141414;
  border:1px solid #262626;
  border-radius:16px;
  transition: transform .3s, box-shadow .3s;
}
.card:hover { transform:translateY(-6px); box-shadow:0 0 30px rgba(168,85,247,.25); }

/* Buttons */
.btn {
  border:1px solid #a855f7;
  color:#a855f7;
  padding:10px 18px;
  border-radius:999px;
  transition:.3s;
}
.btn:hover { background:#a855f7; color:#0b0b0b; }

/* Skill bars */
.skill-bar {
  background:#262626;
  height:8px;
  border-radius:999px;
  overflow:hidden;
}
.skill-fill {
  height:100%;
  background:linear-gradient(90deg,#a855f7,#22d3ee);
  transition: width .8s ease;
}

/* ANIMATIONS */
.fade-up { opacity:0; transform:translateY(40px); transition:all .8s ease; }
.fade-up.show { opacity:1; transform:translateY(0); }

/* Typing effect for name */
.type {
  overflow: hidden;
  border-right: 2px solid #38bdf8;
  white-space: nowrap;
  animation: typing 2.5s steps(20), blink 0.8s infinite;
  width: fit-content;
}
@keyframes typing { from { width: 0 } to { width: 100% } }
@keyframes blink { 50% { border-color: transparent } }

/* Skill hover */
.skill { background: rgba(255,255,255,0.08); padding:12px; border-radius:12px; text-align:center; transition: transform 0.3s, background 0.3s; }
.skill:hover { transform: scale(1.08); background: rgba(56,189,248,0.25); }

/* Art section float */
.art img { animation: float 6s ease-in-out infinite; border-radius:12px; }
.art img:nth-child(even) { animation-delay: 1.5s; }
@keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

/* Optional animated background */
body { background-size: 400% 400%; animation: gradientShift 18s ease infinite; }
@keyframes gradientShift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; }
}
</style>
</head>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<script>
const { createElement, useState } = React;
const { createRoot } = ReactDOM;

/* ---------------- DATA ---------------- */
const kpis = [
  { label:"Records Analyzed", value:"25k+" },
  { label:"Dashboards Built", value:"6+" },
  { label:"Automation Reduction", value:"40%" },
  { label:"Graduate GPA", value:"4.0" }
];

const skills = [
  { name:"Python (Pandas, NumPy)", level:90 },
  { name:"SQL (Analytics & Validation)", level:85 },
  { name:"Data Visualization (Looker, Power BI)", level:80 },
  { name:"Statistical Analysis (SPSS)", level:75 },
  { name:"ETL & Data Cleaning", level:85 },
  { name:"Automation (Selenium, Postman)", level:70 }
];

const education = [
  { degree:"Master of Science in Data Analytics", school:"University XYZ", year:"2025", details:"GPA: 4.0 | Relevant Coursework: Data Mining, Machine Learning, Business Analytics" },
  { degree:"Bachelor of Science in Computer Science", school:"University ABC", year:"2023", details:"GPA: 3.8 | Relevant Coursework: Algorithms, Databases, Programming" }
];

const experience = [
  { role:"Data Analyst Intern", org:"Excelerate", impact:"Built ETL pipelines and KPI dashboards supporting real-time business decisions." },
  { role:"Quality Engineering Associate", org:"Accenture", impact:"Automated test suites and validated data integrity across enterprise systems." }
];

const achievements = [
  "Recipient of Data Science Excellence Award, 2025",
  "Certified in TOGAF and IAM frameworks",
  "Power BI Dashboard Competition Winner"
];

const projects = [
  { title:"AI-Powered Cybersecurity Recruitment Platform", img:"placeholder-project1.png", link:"#", summary:"AI platform for cybersecurity recruitment with resume parsing, AI scoring, and skill verification." },
  { title:"Washington State Data Breach Dashboard", img:"placeholder-project2.png", link:"#", summary:"Power BI dashboard analyzing trends and impacts of data breaches from 2016–2026." },
  { title:"Electric Vehicle Statistical Analysis", img:"placeholder-project3.png", link:"#", summary:"SPSS statistical analysis of EV adoption trends and CAFV eligibility in Washington State." }
];

const art = [
  "placeholder-art1.png","placeholder-art2.png","placeholder-art3.png",
  "placeholder-art4.png","placeholder-art5.png","placeholder-art6.png"
];

/* ---------------- COMPONENTS ---------------- */
const Section = ({ id, title, children }) =>
  createElement("section",{id,className:"py-20 fade-up"},
    createElement("div",{className:"max-w-6xl mx-auto px-6"},
      createElement("h2",{className:"text-4xl font-bold mb-10"},title),
      children
    )
  );

const App = () => {
  return createElement("div",null,

    /* NAV */
    createElement("header",{className:"sticky top-0 bg-black/80 backdrop-blur border-b border-gray-800 z-50"},
      createElement("div",{className:"max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"},
        createElement("span",{className:"font-bold accent-cyan"},"Harika Aakula"),
        createElement("nav",{className:"space-x-6 text-sm"},
          ["About","Education","Experience","Projects","Skills","Achievements","Art","Contact"].map(s =>
            createElement("a",{href:"#"+s.toLowerCase(),className:"hover:accent-cyan"},s)
          )
        )
      )
    ),

    /* ABOUT */
    createElement(Section,{id:"about",title:"About Me"},
      createElement("div",{className:"flex flex-col md:flex-row items-center gap-8"},
        createElement("img",{src:"placeholder-profile.png", className:"w-48 h-48 rounded-full border-4 border-accent-purple object-cover fade-up"}),
        createElement("div",{className:"max-w-3xl text-gray-300 fade-up"},
          createElement("p",null,"Adaptable, quick learner, passionate about data analytics and creative arts. Experienced in Python, SQL, Power BI, and building AI-powered solutions."),
          createElement("a",{href:"placeholder-resume.pdf", className:"btn mt-4 inline-block"},"Download Resume")
        )
      )
    ),

    /* EDUCATION */
    createElement(Section,{id:"education",title:"Education"},
      education.map(e =>
        createElement("div",{className:"card p-6 mb-6 fade-up"},
          createElement("h3",{className:"font-bold"},e.degree),
          createElement("p",{className:"accent-cyan text-sm mb-1"},e.school + " | " + e.year),
          createElement("p",{className:"text-gray-400"},e.details)
        )
      )
    ),

    /* EXPERIENCE */
    createElement(Section,{id:"experience",title:"Professional Experience"},
      experience.map(e =>
        createElement("div",{className:"card p-6 mb-6 fade-up"},
          createElement("h3",{className:"font-bold"},e.role),
          createElement("p",{className:"accent-cyan text-sm mb-2"},e.org),
          createElement("p",{className:"text-gray-400"},e.impact)
        )
      )
    ),

    /* PROJECTS */
    createElement(Section,{id:"projects",title:"Selected Projects"},
      createElement("div",{className:"grid md:grid-cols-3 gap-8"},
        projects.map(p =>
          createElement("a",{href:p.link,className:"card p-4 fade-up"},
            createElement("img",{src:p.img,className:"rounded-md mb-4"}),
            createElement("h3",{className:"font-bold mb-1"},p.title),
            createElement("p",{className:"text-gray-400 text-sm"},p.summary)
          )
        )
      )
    ),

    /* SKILLS */
    createElement(Section,{id:"skills",title:"Analytics Skillset"},
      skills.map(s =>
        createElement("div",{className:"mb-6 fade-up"},
          createElement("div",{className:"flex justify-between text-sm mb-1"},
            createElement("span",null,s.name),
            createElement("span",{className:"accent-cyan"},s.level+"%")
          ),
          createElement("div",{className:"skill-bar"},
            createElement("div",{className:"skill-fill",style:{width:s.level+"%"}})
          )
        )
      )
    ),

    /* ACHIEVEMENTS */
    createElement(Section,{id:"achievements",title:"Achievements"},
      createElement("ul",{className:"list-disc ml-6 text-gray-300 fade-up"},
        achievements.map(a => createElement("li",null,a))
      )
    ),

    /* ART / CREATIVE */
    createElement(Section,{id:"art",title:"Creative Works"},
      createElement("div",{className:"grid grid-cols-2 md:grid-cols-3 gap-4 art"},
        art.map(a => createElement("img",{src:a,className:"fade-up"}))
      )
    ),

    /* CONTACT */
    createElement("section",{id:"contact",className:"py-24 text-center fade-up"},
      createElement("h2",{className:"text-4xl font-bold mb-6"},"Open to Data Analyst Roles"),
      createElement("p",{className:"text-gray-400 mb-10"},"Available for full-time roles starting Jan 2026 (OPT)"),
      createElement("div",{className:"flex justify-center gap-6"},
        createElement("a",{href:"mailto:harika.aakula05@gmail.com",className:"btn"},"Email"),
        createElement("a",{href:"https://github.com/harikaaakula",className:"btn"},"GitHub"),
        createElement("a",{href:"https://linkedin.com/in/harika-aakula-634b48198",className:"btn"},"LinkedIn")
      )
    )
  );
};

createRoot(document.getElementById("root")).render(createElement(App));

/* ---------------- SCROLL ANIMATION ---------------- */
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('show'); });
});
document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
