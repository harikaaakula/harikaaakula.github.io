<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harika Aakula | Portfolio</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- AOS Animation Library -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<!-- Particles.js -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.min.js"></script>

<style>
body { font-family: 'Poppins', sans-serif; background:#0b0b0b; color:#e5e7eb; overflow-x:hidden; }
.bg-panel { background:#141414; }
.accent-purple { color:#a855f7; }
.accent-cyan { color:#22d3ee; }
.card { background:#1a1a1a; border-radius:16px; border:1px solid #262626; transition: transform .3s, box-shadow .3s; }
.card:hover { transform: translateY(-6px); box-shadow: 0 0 30px rgba(168,85,247,.25); }
.btn { border:1px solid #a855f7; color:#a855f7; padding:10px 18px; border-radius:999px; transition:.3s; }
.btn:hover { background:#a855f7; color:#0b0b0b; }
.skill-icon { font-size:2rem; margin-bottom:8px; }
.project-img { border-radius:12px; transition: transform .3s; }
.project-img:hover { transform: scale(1.05); }
</style>
</head>

<body>
<div id="particles"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/react-icons@4.10.1/dist/react-icons.min.js"></script>

<script>
const { createElement, useState, useEffect } = React;
const { createRoot } = ReactDOM;
const { FaPython, FaDatabase, FaChartBar, FaProjectDiagram, FaCode, FaPaintBrush } = ReactIcons;

/* --------------- DATA ---------------- */
const about = {
  name: "Harika Aakula",
  intro: "Data Analyst & Cybersecurity Enthusiast with a passion for transforming data into actionable insights. Adaptable, quick learner, and creatively inclined in art and design.",
  picture: "PLACEHOLDER_FOR_YOUR_PICTURE.jpg",
  resume: "PLACEHOLDER_FOR_YOUR_RESUME.pdf"
};

const education = [
  { degree:"MS in Information Systems", uni:"Saint Louis University", years:"2025-2026", details:"Courses: Data Analytics, Cloud Security, Software Development, Applied Research Methods" }
];

const experience = [
  { role:"Data Analyst Intern", org:"Excelerate", years:"2025", impact:"Built ETL pipelines and dashboards supporting real-time business decisions." },
  { role:"Quality Engineering Associate", org:"Accenture", years:"2024-2025", impact:"Automated test suites and validated data integrity across enterprise systems." }
];

const skills = [
  { icon:<FaPython />, name:"Python (Pandas, NumPy)" },
  { icon:<FaDatabase />, name:"SQL & Databases" },
  { icon:<FaChartBar />, name:"Data Visualization (Power BI, Looker)" },
  { icon:<FaProjectDiagram />, name:"ETL & Data Cleaning" },
  { icon:<FaCode />, name:"Web & App Development" },
  { icon:<FaPaintBrush />, name:"Creative Design & Art" }
];

const achievements = [
  "Dean’s List 2025",
  "Certified Python & SQL Practitioner",
  "Power BI Data Storytelling Award",
  "Hackathon Winner - Cybersecurity Challenge"
];

const projects = [
  {
    title:"AI-Powered Cybersecurity Recruitment Platform",
    images:["PLACEHOLDER1.jpg","PLACEHOLDER2.jpg","PLACEHOLDER3.jpg"],
    link:"#"
  },
  {
    title:"Washington State Data Breach Dashboard",
    images:["PLACEHOLDER4.jpg","PLACEHOLDER5.jpg","PLACEHOLDER6.jpg"],
    link:"#"
  },
  {
    title:"Electric Vehicles Statistical Analysis",
    images:["PLACEHOLDER7.jpg","PLACEHOLDER8.jpg","PLACEHOLDER9.jpg"],
    link:"#"
  }
];

const creative = [
  "ART_PLACEHOLDER1.jpg","ART_PLACEHOLDER2.jpg","ART_PLACEHOLDER3.jpg",
  "ART_PLACEHOLDER4.jpg","ART_PLACEHOLDER5.jpg","ART_PLACEHOLDER6.jpg"
];

/* --------------- COMPONENTS ---------------- */

const Section = ({ id, title, children }) =>
  createElement("section",{id,className:"py-20"},
    createElement("div",{className:"max-w-6xl mx-auto px-6"},
      createElement("h2",{className:"text-4xl font-bold mb-10", "data-aos":"fade-up"},title),
      children
    )
  );

const App = () => {
  useEffect(()=>{AOS.init({duration:800});},[]);

  return createElement("div",null,
    /* NAV */
    createElement("header",{className:"sticky top-0 bg-black/80 backdrop-blur border-b border-gray-800 z-50"},
      createElement("div",{className:"max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"},
        createElement("span",{className:"font-bold accent-cyan"},"Harika Aakula"),
        createElement("nav",{className:"space-x-6 text-sm"},
          ["About","Education","Experience","Skills","Projects","Achievements","Creative"].map(s =>
            createElement("a",{href:"#"+s.toLowerCase(),className:"hover:accent-cyan"},s)
          )
        )
      )
    ),

    /* HERO / ABOUT */
    createElement("section",{id:"about",className:"py-28 flex flex-col md:flex-row items-center max-w-6xl mx-auto px-6"},
      createElement("img",{src:about.picture,className:"w-48 h-48 rounded-full mb-6 md:mb-0 md:mr-10 border-4 border-accent-purple", "data-aos":"fade-right"}),
      createElement("div",{"data-aos":"fade-left"},
        createElement("h1",{className:"text-5xl font-extrabold mb-4"},"Hi, I'm ", createElement("span",{className:"accent-purple"},about.name)),
        createElement("p",{className:"text-gray-400 mb-6"},about.intro),
        createElement("a",{href:about.resume, className:"btn"},"View Resume")
      )
    ),

    /* EDUCATION */
    createElement(Section,{id:"education",title:"Education"},
      education.map(e=>
        createElement("div",{className:"card p-6 mb-6 flex flex-col md:flex-row items-center", "data-aos":"fade-up"},
          createElement("div",{className:"md:w-2/3"},
            createElement("h3",{className:"text-xl font-bold"},e.degree),
            createElement("p",{className:"accent-cyan"},e.uni + " | " + e.years),
            createElement("p",{className:"text-gray-400 mt-2"},e.details)
          )
        )
      )
    ),

    /* EXPERIENCE */
    createElement(Section,{id:"experience",title:"Professional Experience"},
      experience.map(e=>
        createElement("div",{className:"card p-6 mb-6 flex flex-col md:flex-row", "data-aos":"fade-up"},
          createElement("div",{className:"md:w-2/3"},
            createElement("h3",{className:"text-xl font-bold"},e.role),
            createElement("p",{className:"accent-cyan"},e.org + " | " + e.years),
            createElement("p",{className:"text-gray-400 mt-2"},e.impact)
          )
        )
      )
    ),

    /* SKILLS */
    createElement(Section,{id:"skills",title:"Skills"},
      createElement("div",{className:"grid grid-cols-2 md:grid-cols-3 gap-8"},
        skills.map(s=>
          createElement("div",{className:"card p-6 flex flex-col items-center text-center", "data-aos":"zoom-in"},
            createElement("div",{className:"skill-icon mb-2"},s.icon),
            createElement("p",{className:"mt-2 font-semibold"},s.name)
          )
        )
      )
    ),

    /* PROJECTS */
    createElement(Section,{id:"projects",title:"Projects"},
      projects.map(p=>
        createElement("div",{className:"card p-6 mb-6", "data-aos":"fade-up"},
          createElement("h3",{className:"text-xl font-bold mb-4"},p.title),
          createElement("div",{className:"grid grid-cols-3 gap-4 mb-4"},
            p.images.map(img => createElement("img",{src:img,className:"project-img"}))
          ),
          createElement("a",{href:p.link,className:"btn"},"View Project")
        )
      )
    ),

    /* ACHIEVEMENTS */
    createElement(Section,{id:"achievements",title:"Achievements"},
      createElement("div",{className:"grid md:grid-cols-2 lg:grid-cols-4 gap-6"},
        achievements.map(a=>
          createElement("div",{className:"card p-6 text-center", "data-aos":"flip-left"},
            createElement("p",{className:"font-semibold"},a)
          )
        )
      )
    ),

    /* CREATIVE */
    createElement(Section,{id:"creative",title:"Creative Portfolio"},
      createElement("div",{className:"grid md:grid-cols-3 gap-6"},
        creative.map(img => createElement("img",{src:img,className:"project-img", "data-aos":"fade-up"}))
      )
    )
  );
};

createRoot(document.getElementById("root")).render(createElement(App));

/* ---------------- Particles Background ---------------- */
tsParticles.load("particles", {
  fpsLimit: 60,
  background: { color: "#0b0b0b" },
  particles: {
    number: { value: 80, density: { enable: true, area: 800 } },
    color: { value: ["#a855f7","#22d3ee"] },
    shape: { type: "circle" },
    opacity: { value: 0.3 },
    size: { value: { min: 1, max: 4 } },
    move: { enable: true, speed: 1, direction: "none", outMode: "bounce" }
  },
  interactivity: {
    events: { onHover: { enable: true, mode: "repulse" }, onClick: { enable: false } },
    modes: { repulse: { distance: 100 } }
  },
  detectRetina: true
});
</script>

<script>
AOS.init({ duration: 800 });
</script>
</body>
</html>
